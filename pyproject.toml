[project]
name = "alleg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Josh Lee", email = "jleedev@gmail.com" }
]
requires-python = ">=3.10.0,<3.15"
dependencies = [
    "ckanapi>=4.11",
    "ipywidgets>=8.1.9",
    "jinja2>=3.1.6",
    "jupyterlab>=4.6.5",
    "markdown>=3.10.3",
    "matplotlib>=3.10.9",
    "polars[rtcompat]>=2.0.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[project.scripts]
alleg = "alleg:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
